# Runs on every push: installs, builds the static site, starts the Express server,
# and checks that each page loads. Catches broken templates before they reach main.
name: Check site

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Build static site
        run: |
          npm run build
          for f in index.html about/index.html projects/index.html projects/workday/index.html projects/lexitrack/index.html 404.html CNAME assets/styles.css; do
            test -s "dist/$f" || { echo "Missing dist/$f"; exit 1; }
          done
          grep -q 'aria-current="page"' dist/about/index.html
          grep -q 'class="theme-toggle"' dist/index.html
          grep -q 'assets/styles.css?v=' dist/about/index.html

      - name: Start server and check routes
        run: |
          npm start &
          for i in $(seq 1 20); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 0.5; done
          check() {
            code=$(curl -s -o /tmp/page.html -w "%{http_code}" "http://localhost:3000$1")
            echo "$1 -> $code"
            [ "$code" = "$2" ] || exit 1
            grep -q -- "$3" /tmp/page.html || { echo "  missing: $3"; exit 1; }
          }
          check /           200 "Hi, I'm David"
          check /about      200 "My Story"
          check /about/     200 "My Story"
          check /about/     200 "How I Got Here"
          check /about/     200 'id="work"'
          check /about/     200 "From backlog to license"
          check /about/     200 "Want to work together?"
          check /about/     200 "Professional Scrum Master I"
          check /images/story/brazil.jpg 200 ""
          check /projects   200 "LexiTrack"
          check /projects/  200 "LexiTrack"
          check /projects/  200 'class="project-grid"'
          check /projects/  200 "Study Smarter AI"
          check /about/     200 "Relevant Coursework"
          check /about/     200 "IS GPA 3.74"
          check /about/     200 "Database Systems"
          check /projects/workday/          200 "Integrations for BYU"
          check /projects/workday/          200 'class="star"'
          check /projects/lexitrack         200 "My mom is a teacher"
          check /projects/twofold/          200 "Having everything isn"
          check /projects/study-smarter-ai/ 200 "spaced-repetition"
          check /projects/tech-transfer/    200 "Example I licensed"
          check /                           200 "Project details"
          check /nope       404 "Page not found"
          check /assets/styles.css 200 "data-theme=\"light\""
          check /assets/script.js 200 "theme-toggle"
          check /images/headshot.jpg 200 ""
          check /resume.pdf 200 "PDF"
          check /favicon.svg 200 "svg"
          check /images/about.jpg 200 ""
